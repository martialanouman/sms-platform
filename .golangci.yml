version: "2"

linters:
  enable:
    - depguard
    - gosec
    - revive
  settings:
    depguard:
      rules:
        core:
          list-mode: strict
          files:
            - "**/internal/*/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/martialanouman/sms-platform
            - go.yaml.in/yaml/v3
          deny:
            - pkg: "net$"
              desc: le cœur ne fait pas d'I/O (ADR 0025)
            - pkg: net/http
              desc: le cœur ne fait pas d'I/O (ADR 0025)
            - pkg: net/rpc
              desc: le cœur ne fait pas d'I/O (ADR 0025)
            - pkg: net/smtp
              desc: le cœur ne fait pas d'I/O (ADR 0025)
            - pkg: os
              desc: le cœur ne fait pas d'I/O (ADR 0025)
            - pkg: database/sql
              desc: le cœur ne fait pas d'I/O (ADR 0025)
            - pkg: syscall
              desc: le cœur ne fait pas d'I/O (ADR 0025)
            - pkg: io/ioutil
              desc: le cœur ne fait pas d'I/O (ADR 0025)
            - pkg: crypto/tls
              desc: le cœur ne fait pas d'I/O (ADR 0025)
            - pkg: "log$"
              desc: le cœur ne fait pas d'I/O (ADR 0025)
            - pkg: log/syslog
              desc: le cœur ne fait pas d'I/O (ADR 0025)
    revive:
      rules:
        - name: exported

  exclusions:
    rules:
      # G304, G703 : les outils lisent et écrivent des chemins du dépôt, fixés par eux ou par la recette ; aucune
      # entrée non fiable.
      - path: ^tools/
        text: "G304:|G703:"
        linters:
          - gosec
      # G204, G702 : git reçoit une liste d'arguments, sans shell ; la référence vient du développeur ou de la CI.
      - path: ^tools/
        text: "G204:|G702:"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: false
