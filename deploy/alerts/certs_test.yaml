rule_files:
  - certs.yaml
evaluation_interval: 1m
tests:
  - interval: 1h
    input_series:
      - series: certmanager_certificate_expiration_timestamp_seconds{name="catalog-apply-tls", namespace="sms"}
        values: 608400x3
    alert_rule_test:
      - eval_time: 0h
        alertname: CertificateExpiresSoon
        exp_alerts: []
      - eval_time: 2h
        alertname: CertificateExpiresSoon
        exp_alerts:
          - exp_labels:
              name: catalog-apply-tls
              namespace: sms
            exp_annotations:
              summary: Un certificat interne expire dans moins de 7 jours
              description: cert-manager n'a pas renouvelé ce certificat ; ses porteurs perdront leur mTLS à l'échéance.
  - interval: 1m
    input_series:
      - series: certmanager_certificate_ready_status{name="catalog-apply-tls", namespace="sms", condition="False"}
        values: 1x15
      - series: certmanager_certificate_ready_status{name="postgres-server", namespace="postgres", condition="False"}
        values: 0x15
    alert_rule_test:
      - eval_time: 5m
        alertname: CertificateNotReady
        exp_alerts: []
      - eval_time: 11m
        alertname: CertificateNotReady
        exp_alerts:
          - exp_labels:
              name: catalog-apply-tls
              namespace: sms
              condition: "False"
            exp_annotations:
              summary: Un certificat interne n'est pas émis depuis dix minutes
              description: cert-manager ne parvient pas à émettre ou renouveler ce certificat ; l'échéance ne le couvre pas, il n'en a pas.
