apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-apply
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-apply
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: catalog-apply
          image: ghcr.io/martialanouman/sms-platform/catalog-apply
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: KAFKA_BROKERS
              value: kafka-kafka-bootstrap.kafka.svc:9093
            - name: TLS_CERT_FILE
              value: /tls/tls.crt
            - name: TLS_KEY_FILE
              value: /tls/tls.key
            - name: TLS_CA_FILE
              value: /tls/ca.crt
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-apply
                  key: postgres-url
            - name: POSTGRES_ROLE_SECRETS_DIR
              value: /secrets/postgres
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: role-secrets
              mountPath: /secrets/postgres
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: catalog-apply-tls
        - name: role-secrets
          projected:
            sources:
              - secret:
                  name: admin-api-svc
                  items:
                    - key: postgres-password
                      path: admin_api_svc
              - secret:
                  name: dashboard
                  items:
                    - key: postgres-password
                      path: dashboard
