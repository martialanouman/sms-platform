<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-page);font:var(--text-body);color:var(--text-primary)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:10px}
.k{font:var(--text-data-sm);color:var(--text-primary)}.v{font:var(--text-data-sm);color:var(--text-faint)}
.cap{font:var(--text-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-faint)}
.tile{border:1px solid var(--border-default);border-radius:var(--r-card);overflow:hidden;background:var(--surface-card)}
.tile .chip{height:44px;border-bottom:1px solid var(--border-subtle)}
.tile .meta{padding:7px 9px;display:flex;flex-direction:column;gap:2px}
.note{font-size:var(--fs-12);color:var(--text-faint);line-height:var(--lh-normal);margin:12px 0 0}
</style></head><body><div class="grid" style="grid-template-columns:repeat(4,1fr);gap:12px">
<div class="pl-metric"><div class="pl-metric__inner"><div class="pl-metric__label">TAUX DE SUCCÈS</div><div class="pl-metric__value">99,64<span class="pl-metric__unit">%</span></div><div class="pl-metric__foot"><span class="pl-metric__delta--up">▲ 4,2 %</span></div></div></div>
<div class="pl-metric pl-metric--mt"><div class="pl-metric__inner"><div class="pl-metric__label">MT / S</div><div class="pl-metric__value">8 123</div><div class="pl-metric__foot">fenêtre 5 min</div></div></div>
<div class="pl-metric pl-metric--mo"><div class="pl-metric__inner"><div class="pl-metric__label">MO / S</div><div class="pl-metric__value">1 987</div><div class="pl-metric__foot">fenêtre 5 min</div></div></div>
<div class="pl-metric pl-metric--danger"><div class="pl-metric__inner"><div class="pl-metric__label">LATENCE P99</div><div class="pl-metric__value">1,24<span class="pl-metric__unit">s</span></div><div class="pl-metric__foot"><span class="pl-metric__delta--down">▼ +38 ms</span></div></div></div>
</div></body></html>
