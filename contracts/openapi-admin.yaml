        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/accounts/{id}/credentials/{credential_id}:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/CredentialId' }]
    patch:
      tags: [credentials]
      summary: Enable or disable a credential
      description: Disabling an `smpp_bind` disconnects the account's live binds. Revocation is `revoke-credential` only.
      operationId: update-credential-status
      security: [{ OperatorBearer: ['credentials:write'] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialStatusUpdate' } } } }
