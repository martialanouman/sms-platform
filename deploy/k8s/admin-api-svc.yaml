apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-api-svc
---
apiVersion: v1
kind: Service
metadata:
  name: admin-api-svc
spec:
  selector:
    app.kubernetes.io/name: admin-api-svc
  ports:
    - name: internal
      port: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api-svc
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-api-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-api-svc
    spec:
      serviceAccountName: admin-api-svc
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 125
      containers:
        - name: admin-api-svc
          image: ghcr.io/martialanouman/sms-platform/admin-api-svc
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: ops
              containerPort: 9090
          env:
            - name: INTERNAL_ADDR
              value: ":8443"
            - name: TLS_ALLOWED_CLIENTS
              value: dashboard
            - name: TLS_CERT_FILE
              value: /tls/tls.crt
            - name: TLS_KEY_FILE
              value: /tls/tls.key
            - name: TLS_CA_FILE
              value: /tls/ca.crt
            - name: JWKS_URL
              value: https://dashboard:8443/.well-known/jwks.json
            - name: CONTENT_KEY_ADDR
              value: content-key-svc:7002
            - name: DASHBOARD_PUBLIC_URL
              value: http://localhost:8080
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: admin-api-svc
                  key: postgres-url
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: admin-api-svc-tls
