version: 2
project_name: sms-platform

builds:
  - id: migrate
    main: ./cmd/migrate
    binary: migrate
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [linux]
    goarch: [amd64]
  - id: catalog-apply
    main: ./cmd/catalog-apply
    binary: catalog-apply
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [linux]
    goarch: [amd64]

dockers_v2:
  - id: migrate
    ids: [migrate]
    images: [ghcr.io/martialanouman/sms-platform/migrate]
    tags: ["{{ .Tag }}"]
    platforms: [linux/amd64]
    build_args:
      BINARY: migrate
  - id: catalog-apply
    ids: [catalog-apply]
    images: [ghcr.io/martialanouman/sms-platform/catalog-apply]
    tags: ["{{ .Tag }}"]
    platforms: [linux/amd64]
    build_args:
      BINARY: catalog-apply

archives:
  - formats: [none]

release:
  target_commitish: "{{ .FullCommit }}"

changelog:
  use: github-native
