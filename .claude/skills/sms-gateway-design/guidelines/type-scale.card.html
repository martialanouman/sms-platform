<!-- @dsCard group="Type" viewport="700x230" name="Échelle IBM Plex Sans" subtitle="Six rôles, pas un de plus — 28 / 19 / 15 / 13 / 12 / 10,5" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-page);font:var(--text-body);color:var(--text-primary)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:10px}
.k{font:var(--text-data-sm);color:var(--text-primary)}.v{font:var(--text-data-sm);color:var(--text-faint)}
.cap{font:var(--text-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-faint)}
.tile{border:1px solid var(--border-default);border-radius:var(--r-card);overflow:hidden;background:var(--surface-card)}
.tile .chip{height:44px;border-bottom:1px solid var(--border-subtle)}
.tile .meta{padding:7px 9px;display:flex;flex-direction:column;gap:2px}
.note{font-size:var(--fs-12);color:var(--text-faint);line-height:var(--lh-normal);margin:12px 0 0}
</style></head><body><div class="stack">
<div class="row" style="justify-content:space-between"><span style="font:var(--text-page-title)">Titre de page</span><span class="v">28 / 600</span></div>
<div class="row" style="justify-content:space-between"><span style="font:var(--text-section-title)">Titre de section</span><span class="v">19 / 600</span></div>
<div class="row" style="justify-content:space-between"><span style="font:var(--text-card-title)">Titre de carte</span><span class="v">15 / 600</span></div>
<div class="row" style="justify-content:space-between"><span style="font:var(--text-body);color:var(--text-secondary)">Corps de texte</span><span class="v">13 / 400</span></div>
<div class="row" style="justify-content:space-between"><span style="font:var(--text-label);color:var(--text-muted)">Libellé secondaire</span><span class="v">12 / 400</span></div>
<div class="row" style="justify-content:space-between"><span class="cap">MICRO-LABEL</span><span class="v">10,5 / 600 · caps · +0,08em</span></div>
</div></body></html>
