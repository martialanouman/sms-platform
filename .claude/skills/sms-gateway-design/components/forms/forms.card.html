<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:16px;background:var(--surface-page);color:var(--text-primary)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:14px}.lbl{font:var(--text-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-faint);min-width:74px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}</style></head><body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
(() => {
const { Button, IconButton, Icon, Dot, Badge, Tag, StatusPill, Segmented, Card, Field, Input, Textarea, Select, Checkbox, Switch, RadioGroup, DataTable, MetricTile, KeyValueList, SpanBar, Pagination, Banner, Modal, EmptyState, Toast, ToastStack, Skeleton, SkeletonRows, ErrorState, SideNav, TopBar, Tabs, BalanceCard, MaskedSecret } = window.PasserelleDesignSystem_18220e;
function Demo(){const [pol,setPol]=React.useState('stored_encrypted');return (
  <div className="stack">
    <div className="grid">
      <Field label="Recherche" htmlFor="q"><Input id="q" icon="search" placeholder="MSISDN, ID de message, ID de trace…" /></Field>
      <Field label="Condition destination" htmlFor="m" hint="Testeur regex disponible."><Input id="m" mono defaultValue="^225(05|06|07)…" /></Field>
      <Field label="Poids (weighted)" htmlFor="w" error="Le poids doit être un entier positif."><Input id="w" mono invalid defaultValue="-30" /></Field>
      <Field label="Sender ID" htmlFor="s" hint="11 caractères max · alphanumérique."><Input id="s" mono defaultValue="INFO-CI" className="pl-input--valid" /></Field>
      <Field label="Stratégie" htmlFor="st"><Select id="st" options={['weighted','failover_priority','least_cost','round_robin']} /></Field>
      <Field label="max_sessions" htmlFor="ms" hint="Baisser ce quota ne coupe pas les binds vivants."><Input id="ms" mono defaultValue="4" /></Field>
    </div>
    <Field label="Import en masse" htmlFor="t" hint="Un MSISDN par ligne."><Textarea id="t" mono rows={2} defaultValue={'2250101010101\n2250202020202'} /></Field>
    <div className="grid">
      <div className="stack" style={{gap:10}}>
        <Checkbox label="routes:write" description="Créer et modifier les règles de routage" defaultChecked />
        <Checkbox indeterminate label="Routage" description="3 des 5 permissions accordées" />
        <Checkbox label="content:read" description="Lecture du corps — jamais implicite, toujours auditée" disabled />
        <Switch label="query_sm autorisé" defaultChecked />
        <Switch label="cancel_sm autorisé" />
      </div>
      <RadioGroup name="pol" value={pol} onChange={setPol} options={[
        {value:'off',label:'Ne pas stocker',description:'Aucun corps conservé. Le CDR reste complet.'},
        {value:'stored_plaintext',label:'Stocké en clair',description:'Lisible par tout détenteur de content:read.'},
        {value:'stored_encrypted',label:'Stocké chiffré',description:'Protège le repos ; content:read reste la frontière d’accès.'}]} />
    </div>
  </div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
})();
</script>
</body></html>
