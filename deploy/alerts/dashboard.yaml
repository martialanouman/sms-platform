groups:
  - name: dashboard
    rules:
      - alert: AccessLinkUndeliverable
        expr: max(dashboard_access_links_undeliverable) > 0 or absent(dashboard_access_links_undeliverable >= 0)
        for: 5m
        annotations:
          summary: Un lien d'accès n'a pas pu être envoyé
          description: Dix tentatives d'envoi ont échoué ; l'opérateur n'a pas reçu son lien. Vérifier le relais SMTP, puis en demander un nouveau.
