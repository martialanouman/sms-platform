<!-- @dsCard group="Spacing" viewport="700x150" name="Rayons de bordure" subtitle="7px champs · 12px cartes · 20px pilules" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-page);font:var(--text-body);color:var(--text-primary)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:10px}
.k{font:var(--text-data-sm);color:var(--text-primary)}.v{font:var(--text-data-sm);color:var(--text-faint)}
.cap{font:var(--text-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-faint)}
.tile{border:1px solid var(--border-default);border-radius:var(--r-card);overflow:hidden;background:var(--surface-card)}
.tile .chip{height:44px;border-bottom:1px solid var(--border-subtle)}
.tile .meta{padding:7px 9px;display:flex;flex-direction:column;gap:2px}
.note{font-size:var(--fs-12);color:var(--text-faint);line-height:var(--lh-normal);margin:12px 0 0}
</style></head><body><div class="row" style="gap:16px">
<div style="width:200px;height:56px;border:1px solid var(--border-default);border-radius:var(--r-field);background:var(--surface-card);display:flex;align-items:center;justify-content:center;font-size:var(--fs-12);color:var(--text-muted);text-align:center;padding:0 10px">7px · champs, boutons</div><div style="width:200px;height:56px;border:1px solid var(--border-default);border-radius:var(--r-card);background:var(--surface-card);display:flex;align-items:center;justify-content:center;font-size:var(--fs-12);color:var(--text-muted);text-align:center;padding:0 10px">12px · cartes, modales, bandeaux</div><div style="width:200px;height:56px;border:1px solid var(--border-default);border-radius:var(--r-pill);background:var(--surface-card);display:flex;align-items:center;justify-content:center;font-size:var(--fs-12);color:var(--text-muted);text-align:center;padding:0 10px">20px · pilules, segmented</div>
</div>
<p class="note">Trois rayons seulement. Les points de statut et l'avatar utilisent <span class="k">--r-round</span>.</p></body></html>
