      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/SenderRewriteRule' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
      required: [data, next_cursor]

    BillingCustomer:
      type: object
      description: |
        A customer's billing configuration. Under `balance_scope` `account` there is neither overdraft
        nor hard limit: the floor is 0.
      properties:
        customer_id: { type: string, format: uuid }
        billing_enabled: { type: boolean }
        billing_mode: { type: string, enum: [prepaid, postpaid] }
        overdraft_enabled: { type: boolean }
        overdraft_limit: { type: [integer, "null"], minimum: 0 }
        credit_limit: { type: [integer, "null"], minimum: 0 }
        credit_limit_is_hard: { type: boolean }
        charge_on: { $ref: '#/components/schemas/ChargeOn' }
        rate_plan_id: { type: [string, "null"], format: uuid }
        mo_billing_floor: { type: [integer, "null"] }
        balance_scope: { $ref: '#/components/schemas/OwnerType' }
        updated_at: { type: string, format: date-time }
      required: [customer_id, billing_enabled, billing_mode, overdraft_enabled, overdraft_limit, credit_limit, credit_limit_is_hard, charge_on, rate_plan_id, mo_billing_floor, balance_scope, updated_at]
    BillingCustomerUpdate:
      type: object
      additionalProperties: false
      properties:
        billing_enabled: { type: boolean }
        billing_mode: { type: string, enum: [prepaid, postpaid] }
        overdraft_enabled: { type: boolean }
        overdraft_limit: { type: [integer, "null"], minimum: 0 }
        credit_limit: { type: [integer, "null"], minimum: 0 }
        credit_limit_is_hard: { type: boolean }
        charge_on: { $ref: '#/components/schemas/ChargeOn' }
        rate_plan_id: { type: [string, "null"], format: uuid }
        mo_billing_floor: { type: [integer, "null"] }
    BalanceScopeChange:
      type: object
      additionalProperties: false
      properties:
        balance_scope: { $ref: '#/components/schemas/OwnerType' }
      required: [balance_scope]

    Owner:
      type: object
      properties:
        owner_type: { $ref: '#/components/schemas/OwnerType' }
        owner_id: { type: string, format: uuid }
      required: [owner_type, owner_id]
    OwnerPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Owner' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
      required: [data, next_cursor]
    Balance:
      type: object
      properties:
        owner_type: { $ref: '#/components/schemas/OwnerType' }
        owner_id: { type: string, format: uuid }
        mt: { type: integer, format: int64, description: 'MT balance, in credits; may be negative.' }
        mo: { type: integer, format: int64, description: 'MO counter, in credits.' }
      required: [owner_type, owner_id, mt, mo]
    BalancePage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Balance' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
      required: [data, next_cursor]
    Topup:
      type: object
      additionalProperties: false
      properties:
        credits: { type: integer, format: int64, minimum: 1, maximum: 1000000000 }
        direction: { $ref: '#/components/schemas/Direction' }
        account_id: { type: [string, "null"], format: uuid, description: 'Required under `balance_scope` `account`, refused otherwise.' }
      required: [credits, direction]
    Adjust:
      type: object
      additionalProperties: false
      properties:
        delta: { type: integer, format: int64, minimum: -1000000000, maximum: 1000000000, not: { const: 0 }, description: Signed. }
        direction: { $ref: '#/components/schemas/Direction' }
        account_id: { type: [string, "null"], format: uuid, description: 'Required under `balance_scope` `account`, refused otherwise.' }
      required: [delta, direction]
    Transfer:
      type: object
      additionalProperties: false
      properties:
        credits: { type: integer, format: int64, minimum: 1, maximum: 1000000000 }
        from_account_id: { type: string, format: uuid }
        to_account_id: { type: string, format: uuid }
      required: [credits, from_account_id, to_account_id]

    LedgerEntry:
      type: object
      properties:
        entry_type: { type: string, enum: [lease_grant, lease_refund, late_release, charge, mo_charge, topup, transfer, adjustment] }
        direction: { $ref: '#/components/schemas/Direction' }
        credits: { type: integer, format: int64, description: Signed. }
        at: { type: string, format: date-time }
      required: [entry_type, direction, credits, at]
    LedgerPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
      required: [data, next_cursor]

    RatePlan:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer, format: int64, minimum: 1, readOnly: true }
        credits_per_segment_mt_json: { type: object, additionalProperties: true, description: 'Integer credits per MT segment, by destination and sender type.' }
        credits_per_segment_mo_json: { type: object, additionalProperties: true }
        billing_mode: { type: string, enum: [prepaid, postpaid, either] }
        status: { $ref: '#/components/schemas/ActiveStatus' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, version, credits_per_segment_mt_json, credits_per_segment_mo_json, billing_mode, status, created_at, updated_at]
    RatePlanCreate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        credits_per_segment_mt_json: { type: object, additionalProperties: true }
        credits_per_segment_mo_json: { type: object, additionalProperties: true }
        billing_mode: { type: string, enum: [prepaid, postpaid, either], default: either }
      required: [name, credits_per_segment_mt_json, credits_per_segment_mo_json]
    RatePlanUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        credits_per_segment_mt_json: { type: object, additionalProperties: true }
        credits_per_segment_mo_json: { type: object, additionalProperties: true }
        billing_mode: { type: string, enum: [prepaid, postpaid, either] }
        status: { $ref: '#/components/schemas/ActiveStatus' }
    RatePlanPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/RatePlan' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
      required: [data, next_cursor]

    PlatformPolicy:
      type: object
      properties:
        content_storage: { $ref: '#/components/schemas/ContentStorage' }
        content_retention_days: { type: integer, minimum: 1, description: Default 7. }
        quiet_hours:
          description: Null disables them. Inside the window, a marketing message is refused at admission (`quiet_hours`).
          oneOf:
            - $ref: '#/components/schemas/TimeWindow'
            - type: "null"
        billing_enabled: { type: boolean, description: 'Global switch; off, no customer is billed.' }
      required: [content_storage, content_retention_days, quiet_hours, billing_enabled]
    PlatformPolicyUpdate:
      type: object
      additionalProperties: false
      properties:
        content_storage: { $ref: '#/components/schemas/ContentStorage' }
        content_retention_days: { type: integer, minimum: 1 }
        quiet_hours: { $ref: '#/components/schemas/TimeWindowOrNull' }
        billing_enabled: { type: boolean }

    MessageContent:
      type: object
      description: Exactly one of `text` and `octets` is set.
      properties:
        message_id: { type: string, format: uuid }
        data_coding: { $ref: '#/components/schemas/DataCoding' }
        text: { type: [string, "null"], description: 'Body when `data_coding` is gsm7 or ucs2.' }
        octets: { type: [string, "null"], contentEncoding: base64, description: 'Body when `data_coding` is binary.' }
      required: [message_id, data_coding, text, octets]

    GdprEraseRequest:
      type: object
      additionalProperties: false
      description: '`customer_id` for a customer, `msisdn` for a person.'
      properties:
        subject_type: { type: string, enum: [customer, msisdn] }
        customer_id: { type: string, format: uuid }
        msisdn: { $ref: '#/components/schemas/Msisdn' }
      required: [subject_type]
    GdprEraseJob:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        subject_type: { type: string, enum: [customer, msisdn] }
        customer_id: { type: [string, "null"], format: uuid }
        msisdn:
          oneOf:
            - $ref: '#/components/schemas/Msisdn'
            - type: "null"
        status: { $ref: '#/components/schemas/JobStatus' }
        attestation:
          description: Set once completed.
          oneOf:
            - $ref: '#/components/schemas/Attestation'
            - type: "null"
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
      required: [job_id, subject_type, customer_id, msisdn, status, attestation, created_at, finished_at]
    Attestation:
      type: object
      properties:
        steps:
          type: array
          description: What was erased, in order, each verified after mutation.
          items:
            type: object
            properties:
              step: { type: string }
              completed_at: { type: string, format: date-time }
            required: [step, completed_at]
        exclusions:
          type: array
          description: What survives the erasure, and for how long.
          items:
            type: object
            properties:
              data: { type: string, examples: [audit log] }
              retention: { type: string, examples: [365 days] }
            required: [data, retention]
      required: [steps, exclusions]

    AuditEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        operator: { type: string, description: 'The operator''s `sub`, `service:<name>` or `breakglass:<name>`.' }
        operation_id: { type: string }
        target: { type: string, description: 'A subscriber number in it is masked unless the caller holds `msisdn:reveal`.' }
        request_id: { type: [string, "null"] }
        status: { type: [integer, "null"], description: HTTP status; null while the outcome is not recorded. }
        outcome: { type: [string, "null"], description: 'For a body read: `granted`, `unreadable` or `not_found`.' }
        at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
      required: [id, operator, operation_id, target, request_id, status, outcome, at, finished_at]
    AuditEntryPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
      required: [data, next_cursor]
    AuditChange:
      type: object
      properties:
        actor: { type: string }
        table: { type: string }
        pk: { type: string }
        op: { type: string, enum: [insert, update, delete] }
        before: { type: [object, "null"], additionalProperties: true }
        after: { type: [object, "null"], additionalProperties: true }
        at: { type: string, format: date-time }
      required: [actor, table, pk, op, before, after, at]
    AuditChangePage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AuditChange' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
      required: [data, next_cursor]

    ErrorCodeOrNull:
      oneOf:
        - $ref: '#/components/schemas/ErrorCode'
        - type: "null"
    AntispamVerdictOrNull:
      oneOf:
        - $ref: '#/components/schemas/AntispamVerdict'
        - type: "null"

    MessageDetail:
      type: object
      description: The folded state of a message. For an MT `source_addr` is the sender ID; for an MO it is the subscriber.
      properties:
        message_id: { type: string, format: uuid }
        trace_id: { type: string, format: uuid }
        direction: { $ref: '#/components/schemas/Direction' }
        account_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/MessageStatus' }
        source_addr: { $ref: '#/components/schemas/Msisdn' }
        dest_addr: { $ref: '#/components/schemas/Msisdn' }
        ingress:
          oneOf:
            - $ref: '#/components/schemas/Ingress'
            - type: "null"
        traffic_category:
          oneOf:
            - $ref: '#/components/schemas/TrafficCategory'
            - type: "null"
        route_id: { type: [string, "null"], format: uuid }
        error_code: { $ref: '#/components/schemas/ErrorCodeOrNull' }
        antispam_verdict: { $ref: '#/components/schemas/AntispamVerdictOrNull' }
        antispam_rule_id: { type: [string, "null"], format: uuid }
        segments: { type: array, description: Empty until routed., items: { $ref: '#/components/schemas/SegmentState' } }
        source:
          type: string
          enum: [state, history]
          description: '`state`: exact. `history`: from the CDR, which may lag.'
      required: [message_id, trace_id, direction, account_id, customer_id, status, source_addr, dest_addr, ingress, traffic_category, route_id, error_code, antispam_verdict, antispam_rule_id, segments, source]
    SegmentState:
      type: object
      properties:
        segment_seq: { type: integer, minimum: 0 }
        attempt: { type: integer, minimum: 0 }
        kind: { $ref: '#/components/schemas/TransitionKind' }
        connector_id: { type: [string, "null"], format: uuid }
        connector_account_id: { type: [string, "null"], format: uuid }
        remote_id: { type: [string, "null"], description: The carrier's message ID. }
        sent_source_addr: { type: [string, "null"], description: 'The sender as sent, after rewriting.' }
        error_code: { $ref: '#/components/schemas/ErrorCodeOrNull' }
        raw_dlr_status: { type: [string, "null"] }
        credits: { type: integer, format: int64 }
        charge_on:
          oneOf:
            - $ref: '#/components/schemas/ChargeOn'
            - type: "null"
      required: [segment_seq, attempt, kind, connector_id, connector_account_id, remote_id, sent_source_addr, error_code, raw_dlr_status, credits, charge_on]
    MessageTrace:
      type: object
      properties:
        message_id: { type: string, format: uuid }
        trace_id: { type: string, format: uuid }
        transitions:
          type: array
          items:
            type: object
            properties:
              kind: { $ref: '#/components/schemas/TransitionKind' }
              segment_seq: { type: integer, minimum: 0 }
              attempt: { type: integer, minimum: 0 }
              occurred_at: { type: string, format: date-time }
            required: [kind, segment_seq, attempt, occurred_at]
        source: { type: string, enum: [state, history] }
      required: [message_id, trace_id, transitions, source]

    MessageSearch:
      type: object
      additionalProperties: false
      description: Every filter narrows the result; unknown members are refused.
      properties:
        trace_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        group_id: { type: string, format: uuid, description: Customers currently in the group. }
        connector_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/MessageStatus' }
        direction: { $ref: '#/components/schemas/Direction' }
        traffic_category: { $ref: '#/components/schemas/TrafficCategory' }
        ingress: { $ref: '#/components/schemas/Ingress' }
        error_code: { $ref: '#/components/schemas/ErrorCode' }
        antispam_verdict: { $ref: '#/components/schemas/AntispamVerdict' }
        msisdn:
          $ref: '#/components/schemas/Msisdn'
          description: Exact match on either address, never a prefix.
        from_date: { type: string, format: date-time }
        to_date: { type: string, format: date-time }
      required: [from_date, to_date]
    MessageSummary:
      type: object
      description: One CDR row, per message and per segment. For an MT `source_addr` is the sender ID; for an MO it is the subscriber.
      properties:
        message_id: { type: string, format: uuid }
        trace_id: { type: string, format: uuid }
        segment_seq: { type: integer, minimum: 0 }
        segment_count: { type: integer, minimum: 1 }
        account_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        direction: { $ref: '#/components/schemas/Direction' }
        source_addr: { $ref: '#/components/schemas/Msisdn' }
        sent_source_addr: { type: [string, "null"], description: 'The sender as sent, after rewriting.' }
        dest_addr: { $ref: '#/components/schemas/Msisdn' }
        ingress:
          oneOf:
            - $ref: '#/components/schemas/Ingress'
            - type: "null"
        traffic_category:
          oneOf:
            - $ref: '#/components/schemas/TrafficCategory'
            - type: "null"
        connector_id: { type: [string, "null"], format: uuid }
        connector_account_id: { type: [string, "null"], format: uuid }
        route_id: { type: [string, "null"], format: uuid }
        status: { $ref: '#/components/schemas/MessageStatus' }
        error_code: { $ref: '#/components/schemas/ErrorCodeOrNull' }
        antispam_verdict: { $ref: '#/components/schemas/AntispamVerdictOrNull' }
        credits: { type: integer, format: int64 }
        charge_on:
          oneOf:
            - $ref: '#/components/schemas/ChargeOn'
            - type: "null"
        settlement_status: { type: string, enum: [not_billable, pending, captured, captured_without_dlr, released] }
        submitted_at: { type: string, format: date-time, description: Acceptance time. }
        delivered_at: { type: [string, "null"], format: date-time }
        latency_ms: { type: [integer, "null"], minimum: 0, description: From acceptance to delivery receipt. }
      required: [message_id, trace_id, segment_seq, segment_count, account_id, customer_id, direction, source_addr, sent_source_addr, dest_addr, ingress, traffic_category, connector_id, connector_account_id, route_id, status, error_code, antispam_verdict, credits, charge_on, settlement_status, submitted_at, delivered_at, latency_ms]
    MessageSummaryPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/MessageSummary' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
      required: [data, next_cursor]
    MessageExportRequest:
      type: object
      additionalProperties: false
      properties:
        filters: { $ref: '#/components/schemas/MessageSearch' }
        format: { type: string, enum: [csv, jsonl], default: csv }
        mask_msisdn: { type: boolean, default: true }
      required: [filters]
    ExportJob:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/JobStatus' }
        row_count: { type: [integer, "null"], minimum: 0 }
        download_url: { type: [string, "null"], format: uri, description: 'Set once completed; expires at `expires_at`.' }
        expires_at: { type: [string, "null"], format: date-time }
        error: { type: [string, "null"], description: Why a failed job failed. }
        created_at: { type: string, format: date-time }
      required: [job_id, status, row_count, download_url, expires_at, error, created_at]

    MetricsSummary:
      type: object
      properties:
        window: { type: string, enum: [5m, 15m, 30m, 1h] }
        submitted: { type: integer, minimum: 0 }
        delivered: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0, description: Failed or expired. }
        rejected: { type: integer, minimum: 0 }
        mo_received: { type: integer, minimum: 0 }
        e2e_latency_ms_p50: { type: [number, "null"] }
        e2e_latency_ms_p99: { type: [number, "null"], description: From acceptance to delivery receipt. }
        active_sessions: { type: [integer, "null"], minimum: 0, description: Client binds open at read time; null when the registry cannot be read. }
      required: [window, submitted, delivered, failed, rejected, mo_received, e2e_latency_ms_p50, e2e_latency_ms_p99, active_sessions]
    TrafficMetrics:
      type: object
      properties:
        group_by: { $ref: '#/components/schemas/TrafficDimension' }
        window: { type: string, enum: [5m, 15m, 30m, 1h] }
        series:
          type: array
          items:
            type: object
            properties:
              key: { type: string, description: 'Dimension value: an ID, or `rest` or `smpp` by channel; or the reserved `other`, `ungrouped`, `unknown`.' }
              points:
                type: array
                items:
                  type: object
                  properties:
                    t: { type: string, format: date-time }
                    submitted: { type: integer, minimum: 0 }
                    delivered: { type: integer, minimum: 0 }
                    failed: { type: integer, minimum: 0 }
                    mo_received: { type: integer, minimum: 0 }
                  required: [t, submitted, delivered, failed, mo_received]
            required: [key, points]
      required: [group_by, window, series]

    MetricSnapshot:
      type: object
      description: Platform-wide counters over the last interval, aggregated by the gateway.
      properties:
        emitted_at: { type: string, format: date-time }
        interval_seconds: { type: integer, minimum: 1 }
        submitted: { type: integer, minimum: 0 }
        delivered: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        mo_received: { type: integer, minimum: 0 }
        active_sessions: { type: [integer, "null"], minimum: 0 }
      required: [emitted_at, interval_seconds, submitted, delivered, failed, rejected, mo_received, active_sessions]
    SessionEvent:
      type: object
      description: A client bind opened or closed. Identifiers only.
      properties:
        emitted_at: { type: string, format: date-time }
        account_id: { type: string, format: uuid }
        system_id: { type: string }
        state: { type: string, enum: [bound, unbound] }
        sessions: { type: [integer, "null"], minimum: 0, description: 'The account''s live binds after the change; null on `unbound`.' }
      required: [emitted_at, account_id, system_id, state, sessions]
    ConnectorSnapshot:
      type: object
      properties:
        emitted_at: { type: string, format: date-time }
        connectors: { type: array, items: { $ref: '#/components/schemas/ConnectorStatus' } }
      required: [emitted_at, connectors]

    DeadLetterGroup:
      type: object
      properties:
        group: { type: string }
        count: { type: integer, format: int64, minimum: 0 }
        oldest_at: { type: [string, "null"], format: date-time }
      required: [group, count, oldest_at]
    DeadLetterGroupPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/DeadLetterGroup' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
      required: [data, next_cursor]
    DeadLetterPosition:
      type: object
      description: Position of a record in the dead-letter topic.
      additionalProperties: false
      properties:
        partition: { type: integer, minimum: 0 }
        offset: { type: integer, format: int64, minimum: 0 }
      required: [partition, offset]
    DeadLetter:
      type: object
      properties:
        partition: { type: integer, minimum: 0 }
        offset: { type: integer, format: int64, minimum: 0 }
        dlq_reason: { type: string }
        dlq_at: { type: string, format: date-time }
        source_topic: { type: string }
        source_partition: { type: integer, minimum: 0 }
        source_offset: { type: integer, format: int64, minimum: 0 }
        origin_ts: { type: string, format: date-time }
        replay_count: { type: integer, minimum: 0 }
        message_id: { type: [string, "null"], format: uuid }
        expired: { type: boolean, description: Past its maximum age; not replayable. }
      required: [partition, offset, dlq_reason, dlq_at, source_topic, source_partition, source_offset, origin_ts, replay_count, message_id, expired]
    DeadLetterPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/DeadLetter' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
      required: [data, next_cursor]
    ReplayRequest:
      type: object
      additionalProperties: false
      properties:
        records: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/DeadLetterPosition' } }
      required: [records]
    ReplayResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              partition: { type: integer, minimum: 0 }
              offset: { type: integer, format: int64, minimum: 0 }
              replayed: { type: boolean }
              error:
                description: Why the record was not replayed.
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - type: "null"
            required: [partition, offset, replayed, error]
      required: [results]
