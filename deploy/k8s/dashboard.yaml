apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  selector:
    app.kubernetes.io/name: dashboard
  ports:
    - name: http
      port: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dashboard
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
    spec:
      serviceAccountName: dashboard
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 125
      containers:
        - name: dashboard
          image: ghcr.io/martialanouman/sms-platform/dashboard
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: ops
              containerPort: 9090
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: DASHBOARD_PUBLIC_URL
              value: http://localhost:8080
            - name: DASHBOARD_BOOTSTRAP_EMAIL
              value: operateur@example.test
            - name: SMTP_ADDR
              value: mailpit.mailpit.svc:1025
            - name: SMTP_FROM
              value: dashboard@example.test
            - name: COOKIE_KEY_FILE
              value: /secrets/cookie-key
            - name: TLS_CA_FILE
              value: /ca/ca.crt
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: dashboard
                  key: postgres-url
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: ca
              mountPath: /ca
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: dashboard
            items:
              - key: cookie-key
                path: cookie-key
        - name: ca
          configMap:
            name: internal-ca
