        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/platform/policy:
    get:
      tags: [platform]
      summary: Get the platform policy
      operationId: get-platform-policy
      security: [{ OperatorBearer: ['platform:read'] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformPolicy' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [platform]
      summary: Update the platform policy
      description: Reaches the services on their next configuration reload, without a restart.
      operationId: update-platform-policy
      security: [{ OperatorBearer: ['platform:write'] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformPolicyUpdate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformPolicy' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/messages/{id}/content:
    parameters: [{ $ref: '#/components/parameters/MessageId' }]
    get:
      tags: [content]
      summary: Read a stored message body
      description: |
        The audit log records the read, `granted`, `unreadable` or `not_found`, before the body is
        returned. A message without a stored body, or whose key was destroyed, answers 404.
      operationId: get-message-content
      security: [{ OperatorBearer: ['content:read'] }]
      responses:
        '200':
          description: OK
          headers: { Cache-Control: { $ref: '#/components/headers/NoStore' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MessageContent' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/MessageNotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/customers/{id}/content/erase:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [content]
      summary: Erase a customer's stored bodies
      description: Crypto-shreds the customer's content keys; every stored body becomes unreadable at once. Irreversible.
      operationId: erase-customer-content
      security: [{ OperatorBearer: ['content:erase'] }]
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/gdpr/erase:
    post:
      tags: [gdpr]
      summary: Erase a customer or a person
      description: |
        A customer: its content keys are crypto-shredded, then its CDR rows deleted; the ledger is kept.
        A person: CDR rows and stored bodies with that number are deleted, across customers. Irreversible;
        concluded by an attestation.
      operationId: gdpr-erase
      security: [{ OperatorBearer: ['gdpr:erase'] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GdprEraseRequest' } } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/GdprEraseJob' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/gdpr/erase/{job_id}:
    parameters: [{ $ref: '#/components/parameters/JobId' }]
    get:
      tags: [gdpr]
      summary: Get an erasure job and its attestation
      operationId: get-gdpr-erase-job
      security: [{ OperatorBearer: ['gdpr:erase'] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/GdprEraseJob' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/audit-log:
    get:
      tags: [audit]
      summary: List the control-plane audit log
      description: One entry per mutation and per read under a sensitive scope, newest first. Entries are immutable.
      operationId: list-audit-log
      security: [{ OperatorBearer: ['audit:read'] }]
      parameters:
        - { name: operator, in: query, description: Exact match., schema: { type: string } }
        - { name: from_date, in: query, description: 'Inclusive lower bound on `at`.', schema: { type: string, format: date-time } }
        - { name: to_date, in: query, description: 'Exclusive upper bound on `at`.', schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEntryPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/audit-log/{request_id}/changes:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [audit]
      summary: List the row changes of a mutation
      description: Before and after values; sealed, hashed and key-reference columns are left out.
      operationId: list-audit-changes
      security: [{ OperatorBearer: ['audit:read'] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuditChangePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/messages/{id}:
    parameters: [{ $ref: '#/components/parameters/MessageId' }]
    get:
      tags: [cdr]
      summary: Get a message
      description: Exact within 72 hours of acceptance; beyond, read from the CDR (`source`), which may lag. Never carries the body.
      operationId: get-message
      security: [{ OperatorBearer: ['cdr:read'] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MessageDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/MessageNotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/messages/{id}/trace:
    parameters: [{ $ref: '#/components/parameters/MessageId' }]
    get:
      tags: [cdr]
      summary: Get a message's timeline
      description: Its transitions, from the state, then the CDR. A `trace_id` is resolved by `search-messages`. Never carries the body.
      operationId: get-message-trace
      security: [{ OperatorBearer: ['cdr:read'] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MessageTrace' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/MessageNotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/messages/search:
    post:
      tags: [cdr]
      summary: Search the CDR
      description: Every filter narrows the result. The date window is required and at most 31 days. Never carries the body.
      operationId: search-messages
      security: [{ OperatorBearer: ['cdr:read'] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MessageSearch' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MessageSummaryPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/messages/export:
    post:
      tags: [cdr]
      summary: Export the CDR
      description: |
        The filters of `search-messages`. Capped at 100,000 rows: beyond, the job fails rather than
        truncate. Unmasked numbers (`mask_msisdn` false) require `msisdn:reveal`, else `forbidden_scope`.
        Never carries the body.
      operationId: create-message-export
      security: [{ OperatorBearer: ['cdr:export_bulk'] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MessageExportRequest' } } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/ExportJob' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/messages/export/{job_id}:
    parameters: [{ $ref: '#/components/parameters/JobId' }]
    get:
      tags: [cdr]
      summary: Get an export job
      operationId: get-message-export
      security: [{ OperatorBearer: ['cdr:export_bulk'] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ExportJob' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/metrics/summary:
    get:
      tags: [traffic]
      summary: Traffic counters over a window
      description: Messages accepted within the window, each with its current status; the bucket in progress is excluded.
      operationId: get-metrics-summary
      security: [{ OperatorBearer: ['traffic:read'] }]
      parameters:
        - $ref: '#/components/parameters/Window'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MetricsSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/metrics/traffic:
    get:
      tags: [traffic]
      summary: Traffic time series by dimension
      description: The 20 keys with the most messages get their own series; the rest is summed under `other`.
      operationId: get-traffic-metrics
      security: [{ OperatorBearer: ['traffic:read'] }]
      parameters:
        - { name: group_by, in: query, schema: { $ref: '#/components/schemas/TrafficDimension', default: connector } }
        - $ref: '#/components/parameters/Window'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TrafficMetrics' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/stream/metrics:
    get:
      tags: [stream]
      summary: Live traffic snapshots (WebSocket)
      description: Each text frame is one `MetricSnapshot`, aggregated across replicas.
      operationId: stream-metrics
      security: [{ OperatorBearer: ['stream:read'] }]
      x-websocket-message: { $ref: '#/components/schemas/MetricSnapshot' }
      responses:
        '101': { description: Switching Protocols. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/stream/sessions:
    get:
      tags: [stream]
      summary: Live client bind events (WebSocket)
      description: Each text frame is one `SessionEvent`.
      operationId: stream-sessions
      security: [{ OperatorBearer: ['stream:read'] }]
      x-websocket-message: { $ref: '#/components/schemas/SessionEvent' }
      responses:
        '101': { description: Switching Protocols. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/stream/connectors:
    get:
      tags: [stream]
      summary: Live operator account snapshots (WebSocket)
      description: Each text frame is one `ConnectorSnapshot`.
      operationId: stream-connectors
      security: [{ OperatorBearer: ['stream:read'] }]
      x-websocket-message: { $ref: '#/components/schemas/ConnectorSnapshot' }
      responses:
        '101': { description: Switching Protocols. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/dead-letters:
    get:
      tags: [dead-letters]
      summary: List dead-letter groups
      operationId: list-dead-letter-groups
      security: [{ OperatorBearer: ['dead-letters:read'] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DeadLetterGroupPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/dead-letters/{group}:
    parameters: [{ $ref: '#/components/parameters/Group' }]
    get:
      tags: [dead-letters]
      summary: List the records of a dead-letter group
      description: Metadata only, never the payload.
      operationId: list-dead-letters
      security: [{ OperatorBearer: ['dead-letters:read'] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DeadLetterPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/dead-letters/{group}/replay:
    parameters: [{ $ref: '#/components/parameters/Group' }]
    post:
      tags: [dead-letters]
      summary: Replay dead-letter records
      description: |
        Republishes each record on its source topic with `replay_count + 1` and `origin_ts` unchanged. An
        expired record, or one whose message is already terminal, is refused with `conflict` in its result.
      operationId: replay-dead-letter
      security: [{ OperatorBearer: ['dead-letters:write'] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplayRequest' } } } }
      responses:
        '200': { description: 'One result per record, in request order.', content: { application/json: { schema: { $ref: '#/components/schemas/ReplayResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/jobs/{job_id}:
    parameters: [{ $ref: '#/components/parameters/JobId' }]
    get:
      tags: [jobs]
      summary: Get a job
      description: Imports, content erasure and partition extension. Exports and GDPR erasures have their own reads.
      operationId: get-job
      security: [{ OperatorBearer: ['jobs:read'] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    OperatorBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Operator token, issued by the dashboard BFF for the signed-in operator and signed ES256. It lives
        5 minutes. The gateway verifies it against the BFF's internal JWKS; an unknown `kid` is refused.
        `sub` is the operator ID; the scopes are the union of the operator's roles. There is no service
        account.

  headers:
    NoStore:
      description: The response must not be cached.
      schema: { type: string, const: no-store }

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: id
      in: path
      required: true
      description: Message ID (UUIDv7).
      schema: { type: string, format: uuid }
    SenderId:
      name: sender_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CredentialId:
      name: credential_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    KeywordId:
      name: keyword_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConnectorAccountId:
      name: connector_account_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BindId:
      name: bind_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: request_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    Group:
      name: group
      in: path
      required: true
      description: Consumer group whose dead-letter topic is read.
      schema: { type: string, minLength: 1 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `next_cursor`.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Window:
      name: window
      in: query
      schema: { type: string, enum: [5m, 15m, 30m, 1h], default: 5m }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A retry with the same key applies once.
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing, expired or invalid operator token (`unauthenticated`).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: The token lacks the operation's scope (`forbidden_scope`).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: No such resource (`not_found`).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    MessageNotFound:
      description: No such message (`message_not_found`).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: The current state forbids the operation (`conflict`); `errors[]` says why.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    IdempotencyConflict:
      description: |
        The `Idempotency-Key` is in flight or was used for another body (`idempotency_conflict`), or the
        current state forbids the operation (`conflict`).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InsufficientCredit:
      description: The source balance, counting its open leases, cannot cover the amount (`insufficient_credit`).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    PayloadTooLarge:
      description: The request body exceeds the accepted size (`payload_too_large`).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Malformed request (`validation_error`); `errors[]` details each field.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InternalError:
      description: Unexpected error (`internal_error`).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServiceUnavailable:
      description: A dependency is unreachable (`service_unavailable`); nothing was changed, retry later.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      description: Flat error body. `code` is the stable code of the cause; the HTTP status is on the status line only.
      properties:
        code:
          type: string
          enum:
            - unauthenticated
            - forbidden_scope
            - not_found
            - message_not_found
            - conflict
            - validation_error
            - payload_too_large
            - idempotency_conflict
            - insufficient_credit
            - service_unavailable
            - internal_error
        message:
          type: string
          description: Human-readable explanation.
        errors:
          type: array
          description: Per-field problems.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
            required: [field, message]
      required: [code, message]

    ErrorCode:
      type: string
      description: Why a message or a segment did not succeed, recorded after acceptance.
      enum:
        - invalid_destination
        - invalid_source
        - sender_id_not_authorized
        - recipient_opted_out
        - content_blocked
        - no_route
        - insufficient_credit
        - quiet_hours
        - billing_unavailable
        - message_expired
        - submit_failed
        - ambiguous_submit
        - incomplete_message
        - fallback_exhausted
        - retries_exhausted
        - delivery_failed
        - delivery_expired
        - internal_error

    Msisdn:
      type: string
      description: Subscriber number, E.164. In a response, masked unless the caller holds `msisdn:reveal`.
      examples: ["+12025550101"]

    MsisdnRequest:
      type: object
      additionalProperties: false
      properties:
        msisdn: { $ref: '#/components/schemas/Msisdn' }
      required: [msisdn]

    NextCursor:
      type: [string, "null"]
      description: Cursor of the next page; null on the last one.

    Direction: { type: string, enum: [mt, mo] }
    TrafficCategory: { type: string, enum: [otp, transactional, marketing] }
    DataCoding: { type: string, enum: [gsm7, ucs2, binary] }
    Ingress: { type: string, enum: [rest, smpp] }
    ChargeOn: { type: string, enum: [submit, accept, delivery] }
    OwnerType: { type: string, enum: [customer, account] }
    BindType: { type: string, enum: [transmitter, receiver, transceiver] }
    LinkStatus: { type: string, enum: [up, reconnecting, down, auth_failed] }
    BreakerState: { type: string, enum: [closed, open, half_open] }
    ContentStorage: { type: string, enum: [off, stored_encrypted] }
    ActiveStatus: { type: string, enum: [active, disabled] }
    CustomerGroupStatus: { type: string, enum: [active, archived] }
    CustomerStatus: { type: string, enum: [active, suspended, closed] }
    AccountStatus: { type: string, enum: [active, suspended, closed] }
    SenderIdStatus: { type: string, enum: [pending_carrier_approval, active, disabled] }
    ScriptScope: { type: string, enum: [platform, customer, account] }
    RewriteScope: { type: string, enum: [platform, customer, account, connector] }
    AntispamScope: { type: string, enum: [platform, customer, account] }
    SuppressionScope: { type: string, enum: [inbound_number, account, customer, platform] }
    SuppressionSource: { type: string, enum: [mo_stop, admin, import, carrier, regulator] }
    JobStatus: { type: string, enum: [queued, running, completed, failed] }
    DistributionStrategy: { type: string, enum: [static, round_robin, weighted, failover_priority, hash_based] }
    TrafficDimension: { type: string, enum: [connector, customer, account, group, channel] }

    MessageStatus:
      type: string
      description: Lifecycle of a message, as published on the public API.
      enum: [accepted, enroute, delivered, failed, expired, rejected, rerouted, cancelled]

    TransitionKind:
      type: string
      enum:
        - accepted
        - rejected
        - parked
        - unparked
        - cancelled
        - routed
        - submitted
        - submit_failed
        - not_sent
        - delivered
        - undeliverable
        - expired
        - dlr_window_closed
        - outcome_missing
        - received
        - routed_to_account
        - unrouted
        - delivered_to_account
        - delivery_failed

    AntispamVerdict:
      type: string
      enum: [flag, block]

    TimeWindow:
      type: object
      description: Daily window, in the reference country's time zone. An `end` before `start` crosses midnight.
      additionalProperties: false
      properties:
        start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', examples: ["21:00"] }
        end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', examples: ["08:00"] }
        days:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
      required: [start, end, days]

    RateLimit:
      type: object
      properties:
        max_per_sec: { type: integer, minimum: 1, maximum: 2147483647 }
        burst_capacity: { type: integer, minimum: 1, maximum: 2147483647, description: 'Messages admitted at once before `max_per_sec` paces them.' }
      required: [max_per_sec, burst_capacity]

    RateLimitSet:
      type: object
      additionalProperties: false
      properties:
        max_per_sec: { type: integer, minimum: 1, maximum: 2147483647 }
        burst_capacity: { type: integer, minimum: 1, maximum: 2147483647, description: 'Defaults to `max_per_sec`.' }
      required: [max_per_sec]

    Job:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        kind: { type: string, enum: [exact_route_import, suppression_import, content_erase, partition_extension] }
        status: { $ref: '#/components/schemas/JobStatus' }
        progress: { type: [number, "null"], minimum: 0, maximum: 1 }
        counts:
          type: object
          description: Rows or items handled so far.
          properties:
            processed: { type: integer, minimum: 0 }
            rejected: { type: integer, minimum: 0 }
          required: [processed, rejected]
        error: { type: [string, "null"], description: Why a failed job failed. }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
      required: [job_id, kind, status, progress, counts, error, created_at, finished_at]

    CustomerGroup:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        status: { $ref: '#/components/schemas/CustomerGroupStatus' }
        member_count: { type: integer, minimum: 0 }
        created_by: { $ref: '#/components/schemas/CreatedBy' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, description, status, member_count, created_by, created_at, updated_at]
    CustomerGroupCreate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        description: { type: [string, "null"] }
      required: [name]
    CustomerGroupUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        description: { type: [string, "null"] }
        status: { $ref: '#/components/schemas/CustomerGroupStatus' }
    CustomerGroupPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/CustomerGroup' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
      required: [data, next_cursor]

    CreatedBy:
      type: [string, "null"]
      format: uuid
      description: The creating operator's `sub`; null for a break-glass write.

    MaxAgeOverride:
      type: object
      description: Maximum age per traffic category, in seconds; it can only lower the platform's. Null keeps the platform's.
      additionalProperties: false
      properties:
        otp: { type: [integer, "null"], minimum: 1, maximum: 600 }
        transactional: { type: [integer, "null"], minimum: 1, maximum: 86400 }
        marketing: { type: [integer, "null"], minimum: 1, maximum: 259200 }
      required: [otp, transactional, marketing]

    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/CustomerStatus' }
        group_id: { type: [string, "null"], format: uuid }
        max_age_override: { $ref: '#/components/schemas/MaxAgeOverride' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, status, group_id, max_age_override, created_at, updated_at]
    CustomerCreate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        group_id: { type: [string, "null"], format: uuid }
        max_age_override: { $ref: '#/components/schemas/MaxAgeOverride' }
      required: [name]
    CustomerUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        status: { $ref: '#/components/schemas/CustomerStatus' }
        group_id: { type: [string, "null"], format: uuid }
        max_age_override: { $ref: '#/components/schemas/MaxAgeOverride' }
    CustomerPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Customer' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
      required: [data, next_cursor]

    AccountRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
      required: [id, name]
    SuspensionImpact:
      type: object
      properties:
        accounts_to_suspend: { type: array, items: { $ref: '#/components/schemas/AccountRef' } }
        accounts_closed: { type: array, description: 'Closed accounts, which stay closed.', items: { $ref: '#/components/schemas/AccountRef' } }
        binds_to_disconnect: { type: array, items: { $ref: '#/components/schemas/Session' } }
      required: [accounts_to_suspend, accounts_closed, binds_to_disconnect]

    CustomerContentPolicy:
      type: object
      properties:
        content_storage:
          description: Null inherits the platform policy.
          oneOf:
            - $ref: '#/components/schemas/ContentStorage'
            - type: "null"
        content_retention_days: { type: [integer, "null"], minimum: 1, description: Null inherits the platform policy. }
      required: [content_storage, content_retention_days]
    CustomerContentPolicyUpdate:
      type: object
      additionalProperties: false
      properties:
        content_storage:
          oneOf:
            - $ref: '#/components/schemas/ContentStorage'
            - type: "null"
        content_retention_days: { type: [integer, "null"], minimum: 1 }

    ContentKeyRotated:
      type: object
      properties:
        content_key_id: { type: string, format: uuid, description: The new active key. }
      required: [content_key_id]

    SenderId:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        address: { type: string }
        status: { $ref: '#/components/schemas/SenderIdStatus' }
        traffic_category: { $ref: '#/components/schemas/TrafficCategory' }
        rate_limit:
          description: Null when only the account's limit applies.
          oneOf:
            - $ref: '#/components/schemas/RateLimit'
            - type: "null"
        first_used_at: { type: [string, "null"], format: date-time, description: Set when a message from this sender ID is first routed; from then on it cannot be deleted. }
        created_by: { $ref: '#/components/schemas/CreatedBy' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, customer_id, address, status, traffic_category, rate_limit, first_used_at, created_by, created_at, updated_at]
    SenderIdCreate:
      type: object
      additionalProperties: false
      properties:
        address:
          type: string
          description: Alphanumeric, at most 11 characters, or numeric E.164, at most 15 digits.
          pattern: '^([A-Za-z0-9]{1,11}|\+?[0-9]{1,15})$'
          examples: ["ACME"]
        traffic_category:
          $ref: '#/components/schemas/TrafficCategory'
          default: marketing
      required: [address]
    SenderIdUpdate:
      type: object
      additionalProperties: false
      properties:
        status: { $ref: '#/components/schemas/SenderIdStatus' }
        traffic_category: { $ref: '#/components/schemas/TrafficCategory' }
    SenderIdPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/SenderId' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
      required: [data, next_cursor]

    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/AccountStatus' }
        smpp_enabled: { type: boolean }
        rest_enabled: { type: boolean }
        query_sm_enabled: { type: boolean }
        cancel_sm_enabled: { type: boolean }
        allowed_bind_types: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/BindType' } }
        max_sessions: { type: integer, minimum: 0 }
        rate_limit:
          oneOf:
            - $ref: '#/components/schemas/RateLimit'
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, customer_id, name, status, smpp_enabled, rest_enabled, query_sm_enabled, cancel_sm_enabled, allowed_bind_types, max_sessions, rate_limit, created_at, updated_at]
    AccountCreate:
      type: object
      additionalProperties: false
      properties:
        customer_id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        smpp_enabled: { type: boolean, default: true }
        rest_enabled: { type: boolean, default: true }
        query_sm_enabled: { type: boolean, default: true }
        cancel_sm_enabled: { type: boolean, default: true }
        allowed_bind_types: { type: array, minItems: 1, uniqueItems: true, items: { $ref: '#/components/schemas/BindType' } }
        max_sessions: { type: integer, minimum: 0, default: 1 }
      required: [customer_id, name]
    AccountUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        status: { $ref: '#/components/schemas/AccountStatus' }
    ChannelsUpdate:
      type: object
      additionalProperties: false
      description: At least one channel stays enabled.
      properties:
        smpp_enabled: { type: boolean }
        rest_enabled: { type: boolean }
      required: [smpp_enabled, rest_enabled]
    SessionLimitsUpdate:
      type: object
      additionalProperties: false
      properties:
        max_sessions: { type: integer, minimum: 0 }
        allowed_bind_types: { type: array, minItems: 1, uniqueItems: true, items: { $ref: '#/components/schemas/BindType' } }
      required: [max_sessions, allowed_bind_types]
    SmppOpsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        query_sm_enabled: { type: boolean }
        cancel_sm_enabled: { type: boolean }
    AccountPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Account' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
      required: [data, next_cursor]

    Webhook:
      type: object
      description: The account's MO or receipt webhook. Its secret is never returned after creation or rotation.
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        event_type: { type: string, enum: [mo, dlr] }
        url: { type: string, format: uri }
        status: { $ref: '#/components/schemas/ActiveStatus' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, account_id, event_type, url, status, created_at, updated_at]
    WebhookWithSecret:
      allOf:
        - $ref: '#/components/schemas/Webhook'
        - type: object
          properties:
            secret: { type: string, description: 'HMAC-SHA256 signing secret, shown this once.' }
          required: [secret]
    WebhookCreate:
      type: object
      additionalProperties: false
      properties:
        event_type: { type: string, enum: [mo, dlr] }
        url: { type: string, format: uri, pattern: '^https://', examples: ["https://hooks.example.com/sms"] }
      required: [event_type, url]
    WebhookUpdate:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, format: uri, pattern: '^https://' }
        status: { $ref: '#/components/schemas/ActiveStatus' }

    Credential:
      type: object
      description: Never carries a secret.
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        type: { type: string, enum: [smpp_bind, api_key] }
        system_id: { type: [string, "null"], description: 'Set for `smpp_bind`.' }
        status: { type: string, enum: [active, disabled, revoked] }
        last_used_at: { type: [string, "null"], format: date-time }
        grace_expires_at: { type: [string, "null"], format: date-time, description: Until then the previous secret is accepted too. }
        created_at: { type: string, format: date-time }
        rotated_at: { type: [string, "null"], format: date-time }
      required: [id, account_id, type, system_id, status, last_used_at, grace_expires_at, created_at, rotated_at]
    CredentialWithSecret:
      allOf:
        - $ref: '#/components/schemas/Credential'
        - type: object
          properties:
            secret: { type: string, description: 'The SMPP password or API key, shown this once.' }
          required: [secret]
    CredentialCreate:
      type: object
      additionalProperties: false
      properties:
        type: { type: string, enum: [smpp_bind, api_key] }
        system_id: { type: string, minLength: 1, maxLength: 15, description: 'Required for `smpp_bind`.' }
      required: [type]
    CredentialStatusUpdate:
      type: object
      additionalProperties: false
      properties:
        status: { $ref: '#/components/schemas/ActiveStatus' }
      required: [status]
    CredentialRotate:
      type: object
      additionalProperties: false
      properties:
        grace_period_sec: { type: [integer, "null"], minimum: 0, maximum: 604800, description: How long the old secret stays valid too; at most 7 days. }

    SmppProfile:
      type: object
      description: SMPP session parameters of a connector, applied at the next bind.
      additionalProperties: false
      properties:
        vendor_profile: { type: [string, "null"] }
        interface_version: { type: integer, enum: [52, 80], default: 52, description: '52 is SMPP 3.4, 80 is SMPP 5.0.' }
        addr_ton: { type: integer, minimum: 0, maximum: 255, default: 0 }
        addr_npi: { type: integer, minimum: 0, maximum: 255, default: 0 }
        source_addr_ton: { type: integer, minimum: 0, maximum: 255, default: 0 }
        source_addr_npi: { type: integer, minimum: 0, maximum: 255, default: 0 }
        dest_addr_ton: { type: integer, minimum: 0, maximum: 255, default: 1 }
        dest_addr_npi: { type: integer, minimum: 0, maximum: 255, default: 1 }
        data_coding_default: { type: [integer, "null"], minimum: 0, maximum: 255 }
        esm_class_default: { type: integer, minimum: 0, maximum: 255, default: 0 }
        registered_delivery_default: { type: integer, minimum: 0, maximum: 255, default: 1 }
        priority_flag_default: { type: integer, minimum: 0, maximum: 3, default: 0, description: Sent for a message of effective priority 0. }
        validity_period_default: { type: [string, "null"] }
        enquire_link_interval_sec: { type: integer, minimum: 1, default: 30 }
        enquire_link_max_missed: { type: integer, minimum: 1, default: 3 }
        bind_timeout_ms: { type: integer, minimum: 1, default: 10000 }
        response_timeout_ms: { type: integer, minimum: 1, default: 10000 }

    ReconnectPolicy:
      type: object
      description: Automatic reconnection of the connector's SMPP binds, opt-in. The breaker never reconnects.
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        initial_delay_ms: { type: integer, minimum: 1, default: 1000 }
        multiplier: { type: number, minimum: 1, maximum: 99.99, default: 2 }
        max_delay_ms: { type: integer, minimum: 1, default: 60000 }
        jitter_pct: { type: integer, minimum: 0, maximum: 100, default: 20 }
        max_attempts: { type: integer, minimum: 0, default: 0, description: 0 retries without limit. }
      required: [enabled]

    Connector:
      type: object
      description: A destination, SMPP or HTTP, holding operator accounts. Its throughput is the sum of its available accounts'.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/ActiveStatus' }
        protocol: { type: string, enum: [smpp, http] }
        smpp_profile:
          oneOf:
            - $ref: '#/components/schemas/SmppProfile'
            - type: "null"
        http_adapter: { type: [string, "null"], description: Name of a compiled HTTP adapter. }
        priority_tier: { type: integer, minimum: 0, maximum: 2, description: 'Lowest traffic category rank accepted: 0 all, 1 transactional and otp, 2 otp only.' }
        reconnect_policy: { $ref: '#/components/schemas/ReconnectPolicy' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, status, protocol, smpp_profile, http_adapter, priority_tier, reconnect_policy, created_at, updated_at]
    ConnectorCreate:
      type: object
      additionalProperties: false
      description: '`smpp_profile` is required for `smpp`, `http_adapter` for `http`.'
      properties:
        name: { type: string, minLength: 1 }
        protocol: { type: string, enum: [smpp, http] }
        smpp_profile: { $ref: '#/components/schemas/SmppProfile' }
        http_adapter: { type: string, minLength: 1 }
        priority_tier: { type: integer, minimum: 0, maximum: 2, default: 0 }
        reconnect_policy: { $ref: '#/components/schemas/ReconnectPolicy' }
      required: [name, protocol]
    ConnectorUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        status: { $ref: '#/components/schemas/ActiveStatus' }
        smpp_profile: { $ref: '#/components/schemas/SmppProfile' }
        http_adapter: { type: string, minLength: 1 }
        priority_tier: { type: integer, minimum: 0, maximum: 2 }
    ConnectorPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Connector' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
      required: [data, next_cursor]

    ConnectorAccountStatus: { type: string, enum: [provisioning, active, draining, disabled] }
    ConnectorAccount:
      type: object
      description: An operator account. Its credentials are write-only.
      properties:
        id: { type: string, format: uuid }
        connector_id: { type: string, format: uuid }
        endpoint: { type: string, description: '`host:port` for SMPP, base URL for HTTP.' }
        throughput_limit_per_sec: { type: integer, minimum: 1 }
        max_binds: { type: [integer, "null"], minimum: 1, description: SMPP. }
        max_in_flight: { type: integer, minimum: 1, description: 'Window per bind for SMPP, concurrent requests for HTTP.' }
        bind_type:
          description: SMPP.
          oneOf:
            - $ref: '#/components/schemas/BindType'
            - type: "null"
        tls_enabled: { type: boolean }
        tls_server_name: { type: [string, "null"] }
        partition: { type: integer, minimum: 0, description: 'Partition of the account on the routed topics, never reassigned.' }
        status: { $ref: '#/components/schemas/ConnectorAccountStatus' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, connector_id, endpoint, throughput_limit_per_sec, max_binds, max_in_flight, bind_type, tls_enabled, tls_server_name, partition, status, created_at, updated_at]
    ConnectorAccountCredentials:
      type: object
      description: Write-only, sealed at rest. Keys depend on the protocol and adapter, such as `system_id` and `password` for SMPP.
      minProperties: 1
      additionalProperties: { type: string }
    ConnectorAccountCreate:
      type: object
      additionalProperties: false
      properties:
        endpoint: { type: string, minLength: 1 }
        credentials: { $ref: '#/components/schemas/ConnectorAccountCredentials' }
        throughput_limit_per_sec: { type: integer, minimum: 1 }
        max_binds: { type: [integer, "null"], minimum: 1 }
        max_in_flight: { type: integer, minimum: 1, default: 10 }
        bind_type: { $ref: '#/components/schemas/BindType' }
        tls_enabled: { type: boolean, default: false }
        tls_server_name: { type: [string, "null"] }
      required: [endpoint, credentials, throughput_limit_per_sec]
    ConnectorAccountUpdate:
      type: object
      additionalProperties: false
      properties:
        endpoint: { type: string, minLength: 1 }
        credentials: { $ref: '#/components/schemas/ConnectorAccountCredentials' }
        throughput_limit_per_sec: { type: integer, minimum: 1 }
        max_binds: { type: [integer, "null"], minimum: 1 }
        max_in_flight: { type: integer, minimum: 1 }
        bind_type: { $ref: '#/components/schemas/BindType' }
        tls_enabled: { type: boolean }
        tls_server_name: { type: [string, "null"] }
        status: { type: string, enum: [active, draining, disabled] }
    ConnectorAccountCreated:
      type: object
      properties:
        account: { $ref: '#/components/schemas/ConnectorAccount' }
        job: { $ref: '#/components/schemas/Job' }
      required: [account, job]
    ConnectorAccountPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ConnectorAccount' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
      required: [data, next_cursor]

    ConnectorAccountState:
      type: object
      description: Live state published by the account's lease holder. A state older than 15 seconds makes the account unavailable.
      properties:
        connector_account_id: { type: string, format: uuid }
        holder: { type: [string, "null"], description: Pod holding the lease. }
        epoch: { type: integer, format: int64 }
        link_status: { $ref: '#/components/schemas/LinkStatus' }
        breaker_state: { $ref: '#/components/schemas/BreakerState' }
        in_flight: { type: integer, format: int64, minimum: 0 }
        lag: { type: integer, format: int64, minimum: 0 }
        observed_at: { type: string, format: date-time }
      required: [connector_account_id, holder, epoch, link_status, breaker_state, in_flight, lag, observed_at]
    ConnectorStatus:
      type: object
      properties:
