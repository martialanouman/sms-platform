syntax = "proto3";

package smppserver.v1;

import "sms/v1/dlr.proto";
import "sms/v1/mo.proto";

// SmppServerService delivers return traffic on a bind held by this pod. spec 09 §9.2, spec 04 §4.4.1 ; appelant delivery-svc
service SmppServerService {
  // DeliverSm sends a deliver_sm on a held bind and waits for deliver_sm_resp ; NOT_FOUND if the bind is gone. spec 04 §4.4
  rpc DeliverSm(DeliverSmRequest) returns (DeliverSmResponse);
}

message DeliverSmRequest {
  string bind_id = 1; // spec 04 §4.4.1
  oneof event {
    sms.v1.MoRouted mo = 2; // spec 04 §4.4, I1 : le corps MO quitte la plateforme ici
    sms.v1.DlrRouted dlr = 3; // spec 04 §4.4
  }
}

message DeliverSmResponse {}
