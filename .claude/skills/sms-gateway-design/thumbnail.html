<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:flex;overflow:hidden;background:var(--n-900)}
.main{flex:1;display:flex;align-items:center;justify-content:center;gap:44px;background:var(--n-900)}
.mono{width:200px;height:200px;border-radius:44px;background:linear-gradient(140deg,var(--teal-300),var(--teal-700));color:var(--n-900);display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-size:88px;font-weight:700;letter-spacing:0.01em}
.name{font-family:var(--font-sans);font-weight:600;font-size:104px;letter-spacing:-0.02em;color:var(--n-50);line-height:1;white-space:nowrap}
.strip{width:210px;display:flex;flex-direction:column}
.strip div{flex:1}
</style></head><body>
<div class="main"><span class="mono">SG</span><span class="name">SMS Gateway</span></div>
<div class="strip">
<div style="background:var(--amber-500)"></div>
<div style="background:var(--teal-500)"></div>
<div style="background:var(--green-500)"></div>
<div style="background:var(--violet-500)"></div>
<div style="background:var(--red-500)"></div>
</div>
</body></html>
