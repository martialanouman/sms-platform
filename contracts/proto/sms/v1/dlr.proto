syntax = "proto3";

package sms.v1;

import "google/protobuf/timestamp.proto";
import "sms/v1/common.proto";

// DlrEvent is the payload of dlr.events, dlr.uncorrelated and dlr.unmatched. topics.yaml, spec 04 §4.2.1
message DlrEvent {
  string connector_account_id = 1; // spec 04 §4.2.1 ; clé du topic et de la corrélation (décision 2 §5.2)
  string remote_id = 2; // spec 04 §4.2.1
  DlrStatus status = 3; // spec 04 §4.2.1
  string raw_status = 4; // spec 05 §5.1 attrs « statut DLR brut » : le jeton stat seul, jamais le reçu entier (son text: porte le corps, I1)
  google.protobuf.Timestamp occurred_at = 5; // décision 2 §3.1, heure de l'événement source
}

// DlrRouted is the payload of dlr.routed, the correlated and enriched DLR. topics.yaml, spec 04 §4.2.3
message DlrRouted {
  string message_id = 1; // spec 04 §4.2.3
  uint32 segment_seq = 2; // spec 06 §6.3 (règlement par segment) ; 0 = tout le message (spec 04 §4.2.2)
  uint32 attempt = 3; // décision 2 §5.2, valeur corrélée
  string account_id = 4; // spec 04 §4.2.3, clé du topic
  string customer_id = 5; // spec 04 §4.2.3
  DlrStatus status = 6; // spec 06 §6.3, capture ou libération en mode delivery
  string error_code = 7; // spec 09 §9.3 delivery_failed, delivery_expired
  google.protobuf.Timestamp occurred_at = 8; // décision 2 §3.1
  string source_addr = 9; // spec 04 §4.4.1, accusé deliver_sm au client : adresse soumise, posée à la corrélation
  string dest_addr = 10; // spec 04 §4.4.1, idem
  google.protobuf.Timestamp submitted_at = 11; // spec 04 §4.4.1, « submit date » de l'accusé : heure de accepted, relevée à la corrélation
}
