syntax = "proto3";

package session.v1;

import "google/protobuf/timestamp.proto";

// SessionService is the cross-pod registry of client SMPP binds. spec 02 §2.2, spec 09 §9.2 ; appelants smpp-server, delivery, admin-api
service SessionService {
  // OpenSession registers a bind, refusing it beyond max_sessions. spec 09 §9.2, I6
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  // CloseSession removes a bind. spec 09 §9.2
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
  // ListActiveBinds finds the live binds, of one account or paged. spec 09 §9.2, spec 04 §4.4.1
  rpc ListActiveBinds(ListActiveBindsRequest) returns (ListActiveBindsResponse);
  // Disconnect force-closes binds. spec 01 §1.1 « déconnexion forcée », spec 09 §9.2
  rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);
}

// BindType is the SMPP bind kind. spec 04 §4.4.1 receiver ou transceiver
enum BindType {
  BIND_TYPE_UNSPECIFIED = 0;
  BIND_TYPE_TRANSMITTER = 1;
  BIND_TYPE_RECEIVER = 2;
  BIND_TYPE_TRANSCEIVER = 3;
}

// Session is one live bind. spec 04 §4.4.1
message Session {
  string account_id = 1; // spec 01 §1.1, max_sessions par compte
  string bind_id = 2; // spec 04 §4.4.1, le bind ciblé par le deliver_sm
  BindType bind_type = 3; // spec 04 §4.4.1
  string pod_addr = 4; // spec 04 §4.4.1 « le smpp-server-svc qui le tient »
  google.protobuf.Timestamp connected_at = 5; // spec 01 §1.2, écran des sessions
  string remote_addr = 6; // spec 01 §1.2, écran des sessions
}

message OpenSessionRequest {
  Session session = 1; // spec 09 §9.2
  int32 max_sessions = 2; // I6, plafond lu par smpp-server dans son instantané
}

message OpenSessionResponse {
  bool accepted = 1; // I6 ; refus = max_sessions_exceeded (spec 09 §9.3)
}

message CloseSessionRequest {
  string account_id = 1; // spec 09 §9.2
  string bind_id = 2; // spec 09 §9.2
}

message CloseSessionResponse {}

message ListActiveBindsRequest {
  string account_id = 1; // spec 04 §4.4.1 ; vide = toutes les sessions (spec 01 §1.1 sessions en direct)
  string cursor = 2; // spec 01 §1.3 « sessions en pagination »
  int32 limit = 3; // spec 01 §1.3
}

message ListActiveBindsResponse {
  repeated Session sessions = 1; // spec 04 §4.4.1
  string next_cursor = 2; // spec 01 §1.3
}

// DisconnectScope names what a forced disconnection targets. spec 01 §1.1
enum DisconnectScope {
  DISCONNECT_SCOPE_UNSPECIFIED = 0;
  DISCONNECT_SCOPE_ACCOUNT = 1;
  DISCONNECT_SCOPE_SESSION = 2;
}

message DisconnectRequest {
  DisconnectScope scope = 1; // spec 01 §1.1
  string id = 2; // account_id ou bind_id selon scope
}

message DisconnectResponse {}
