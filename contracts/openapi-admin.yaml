openapi: 3.1.0

info:
  title: SMS Gateway — Admin API
  version: "1.0.0"
  description: |
    Internal control-plane API of the SMS gateway. Its only caller is the dashboard BFF, which forwards
    each request with the signed-in operator's token. Every operation requires exactly the one scope it
    declares.

    - **Lists** are paged by an opaque cursor: pass `next_cursor` back as `cursor`; `null` ends the list.
    - **PATCH** has three states per field: absent leaves it unchanged, `null` clears it, a value replaces
      it.
    - **Subscriber numbers** never travel in a path or a query: searches by number are `POST` requests.
      In a response, a number is masked unless the caller holds `msisdn:reveal`.
    - **Long operations** answer `202` with a job whose state is read back.
    - **Errors** are flat (`code`, `message`, `errors[]`); the HTTP status is on the status line only.

servers:
  - url: https://admin-api.example.com
    description: Example

tags:
  - name: customer-groups
  - name: customers
  - name: sender-ids
  - name: accounts
  - name: credentials
  - name: connectors
  - name: routes
  - name: exact-routes
  - name: routing-scripts
  - name: smpp-sessions
  - name: antispam
  - name: suppressions
  - name: opt-out-keywords
  - name: inbound-numbers
  - name: sender-rewrite
  - name: billing
  - name: platform
  - name: content
  - name: gdpr
  - name: audit
  - name: cdr
  - name: traffic
  - name: stream
  - name: dead-letters
  - name: jobs

paths:

  /admin/customer-groups:
    get:
      tags: [customer-groups]
      summary: List customer groups
      operationId: list-customer-groups
      security: [{ OperatorBearer: ['customer-groups:read'] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CustomerGroupStatus' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerGroupPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [customer-groups]
      summary: Create a customer group
      operationId: create-customer-group
      security: [{ OperatorBearer: ['customer-groups:write'] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerGroupCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerGroup' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/customer-groups/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [customer-groups]
      summary: Get a customer group
      operationId: get-customer-group
      security: [{ OperatorBearer: ['customer-groups:read'] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerGroup' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [customer-groups]
      summary: Update a customer group
      operationId: update-customer-group
      security: [{ OperatorBearer: ['customer-groups:write'] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerGroupUpdate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerGroup' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [customer-groups]
      summary: Delete a customer group
      description: Its customers are detached, not deleted.
      operationId: delete-customer-group
      security: [{ OperatorBearer: ['customer-groups:write'] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/customer-groups/{id}/customers:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [customer-groups]
      summary: List the customers of a group
      operationId: list-group-customers
      security: [{ OperatorBearer: ['customer-groups:read'] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/customers:
    get:
      tags: [customers]
      summary: List customers
      operationId: list-customers
      security: [{ OperatorBearer: ['customers:read'] }]
      parameters:
        - { name: group_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CustomerStatus' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [customers]
      summary: Create a customer
      description: Billing and content policy are set by their own operations.
      operationId: create-customer
      security: [{ OperatorBearer: ['customers:write'] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/customers/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [customers]
      summary: Get a customer
      operationId: get-customer
      security: [{ OperatorBearer: ['customers:read'] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [customers]
      summary: Update a customer
      description: A closed customer stays closed.
      operationId: update-customer
      security: [{ OperatorBearer: ['customers:write'] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerUpdate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [customers]
      summary: Delete a customer
      operationId: delete-customer
      security: [{ OperatorBearer: ['customers:write'] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/customers/{id}/suspend:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [customers]
      summary: Suspend a customer
      description: Suspends its accounts and disconnects their live binds; closed accounts stay closed. A closed customer cannot be suspended.
      operationId: suspend-customer
      security: [{ OperatorBearer: ['customers:write'] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/customers/{id}/suspension-impact:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [customers]
      summary: Preview what suspending a customer affects
      operationId: get-customer-suspension-impact
      security: [{ OperatorBearer: ['customers:read'] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SuspensionImpact' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/customers/{id}/content-policy:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [customers]
      summary: Get a customer's content policy
      description: The customer's own setting; `null` inherits the platform policy.
      operationId: get-customer-content-policy
      security: [{ OperatorBearer: ['customers:read'] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerContentPolicy' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [customers]
      summary: Update a customer's content policy
      description: Applies to bodies stored from then on.
      operationId: update-customer-content-policy
      security: [{ OperatorBearer: ['customers:write'] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerContentPolicyUpdate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerContentPolicy' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/customers/{id}/content/rotate-key:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [customers]
      summary: Rotate a customer's content key
      description: Provisions the first key, or retires the active one and creates the next. A retired key still opens the bodies it sealed.
      operationId: rotate-content-key
      security: [{ OperatorBearer: ['customers:write'] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContentKeyRotated' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/customers/{id}/sender-ids:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [sender-ids]
      summary: List a customer's sender IDs
      operationId: list-sender-ids
      security: [{ OperatorBearer: ['sender-ids:read'] }]
      parameters:
        - { name: traffic_category, in: query, schema: { $ref: '#/components/schemas/TrafficCategory' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SenderIdStatus' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SenderIdPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [sender-ids]
      summary: Register a sender ID
      description: Starts pending carrier approval. Every source address, numeric included, must be an active sender ID of the customer.
      operationId: create-sender-id
      security: [{ OperatorBearer: ['sender-ids:write'] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SenderIdCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SenderId' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/customers/{id}/sender-ids/{sender_id}:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/SenderId' }]
    patch:
      tags: [sender-ids]
      summary: Update a sender ID
      operationId: update-sender-id
      security: [{ OperatorBearer: ['sender-ids:write'] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SenderIdUpdate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SenderId' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [sender-ids]
      summary: Delete a sender ID
      description: Refused once the sender ID has been used; disable it instead.
      operationId: delete-sender-id
      security: [{ OperatorBearer: ['sender-ids:write'] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/customers/{id}/sender-ids/{sender_id}/rate-limit:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/SenderId' }]
    put:
      tags: [sender-ids]
      summary: Set a sender ID's rate limit
      description: Checked at admission, before the account's limit; past it the submission is refused (`rate_limited`) and nothing is written.
      operationId: set-sender-id-rate-limit
      security: [{ OperatorBearer: ['sender-ids:write'] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RateLimitSet' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SenderId' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [sender-ids]
      summary: Remove a sender ID's rate limit
      description: The account's limit alone then applies. Removing an absent limit answers 204.
      operationId: delete-sender-id-rate-limit
      security: [{ OperatorBearer: ['sender-ids:write'] }]
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/accounts:
    get:
      tags: [accounts]
      summary: List accounts
      operationId: list-accounts
      security: [{ OperatorBearer: ['accounts:read'] }]
      parameters:
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { name: group_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AccountStatus' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AccountPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [accounts]
      summary: Create an account
      operationId: create-account
      security: [{ OperatorBearer: ['accounts:write'] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AccountCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/accounts/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [accounts]
      summary: Get an account
      operationId: get-account
      security: [{ OperatorBearer: ['accounts:read'] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [accounts]
      summary: Update an account
      description: A closed account stays closed. Leaving `active` disconnects its live binds.
      operationId: update-account
      security: [{ OperatorBearer: ['accounts:write'] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AccountUpdate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [accounts]
      summary: Delete an account
      operationId: delete-account
      security: [{ OperatorBearer: ['accounts:write'] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/accounts/{id}/suspend:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [accounts]
      summary: Suspend an account
      description: Disconnects its live binds. A closed account cannot be suspended.
      operationId: suspend-account
      security: [{ OperatorBearer: ['accounts:write'] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/accounts/{id}/channels:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [accounts]
      summary: Enable or disable the account's channels
      operationId: set-account-channels
      security: [{ OperatorBearer: ['accounts:write'] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChannelsUpdate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/accounts/{id}/session-limits:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [accounts]
      summary: Set the account's session limits
      description: Lowering `max_sessions` cuts no live bind.
      operationId: set-account-session-limits
      security: [{ OperatorBearer: ['accounts:write'] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SessionLimitsUpdate' } } } }
      responses:
