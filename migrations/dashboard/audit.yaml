operators: {audit: exempt, reason: "les faits sur un opérateur vont au journal d'accès du dashboard, pas au plan de contrôle"}
access_links: {audit: exempt, reason: "état d'exécution de l'outbox ; demande et usage d'un lien vont au journal d'accès"}
sessions: {audit: exempt, reason: "état d'exécution ; connexions et fermetures vont au journal d'accès"}
login_attempt_counters: {audit: exempt, reason: "état d'exécution de l'anti-brute-force, aux sujets hachés"}
access_log: {audit: exempt, reason: le journal lui-même}
totp_factors: {audit: exempt, reason: "secrets scellés ; enrôlements et retraits vont au journal d'accès"}
recovery_codes: {audit: exempt, reason: "codes hachés ; leur usage va au journal d'accès"}
webauthn_credentials: {audit: exempt, reason: "clés publiques ; enregistrements et retraits vont au journal d'accès"}
webauthn_challenges: {audit: exempt, reason: "état d'exécution des cérémonies, mort avec sa session"}
roles: {audit: exempt, reason: "création, modification et suppression d'un rôle vont au journal d'accès du dashboard"}
operator_roles: {audit: exempt, reason: "les changements de rôles d'un opérateur vont au journal d'accès du dashboard"}
