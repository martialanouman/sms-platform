version: "2"

linters:
  enable:
    - depguard
    - forbidigo
    - gosec
    - revive
  settings:
    depguard:
      rules:
        core:
          list-mode: strict
          files:
            - "**/internal/*/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/martialanouman/sms-platform
            - go.yaml.in/yaml/v3
          deny:
            - pkg: "net$"
              desc: le cœur ne fait pas d'I/O (ADR 0025)
            - pkg: net/http
              desc: le cœur ne fait pas d'I/O (ADR 0025)
            - pkg: net/rpc
              desc: le cœur ne fait pas d'I/O (ADR 0025)
            - pkg: net/smtp
              desc: le cœur ne fait pas d'I/O (ADR 0025)
            - pkg: os
              desc: le cœur ne fait pas d'I/O (ADR 0025)
            - pkg: database/sql
              desc: le cœur ne fait pas d'I/O (ADR 0025)
            - pkg: syscall
              desc: le cœur ne fait pas d'I/O (ADR 0025)
            - pkg: io/ioutil
              desc: le cœur ne fait pas d'I/O (ADR 0025)
            - pkg: crypto/tls
              desc: le cœur ne fait pas d'I/O (ADR 0025)
            - pkg: "log$"
              desc: le cœur ne fait pas d'I/O (ADR 0025)
            - pkg: log/syslog
              desc: le cœur ne fait pas d'I/O (ADR 0025)
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^msg\.Reveal$
          pkg: ^github\.com/martialanouman/sms-platform/internal/platform/msg$
          msg: le clair d'un corps ne sort que par un appel audité, exclu ici avec sa raison (I1)
        - pattern: ^(os\.(Getenv|LookupEnv|Environ|ExpandEnv)|(syscall|unix)\.(Getenv|Environ)|exec\.Cmd\.Environ)$
          msg: seul internal/platform/config lit l'environnement, et seulement l'infrastructure (décision 7)
    revive:
      rules:
        - name: exported

  exclusions:
    generated: disable
    rules:
      # G304, G703 : les outils lisent et écrivent des chemins du dépôt, fixés par eux ou par la recette ; aucune
      # entrée non fiable.
      - path: ^tools/(catalog|openapi)/
        text: "G304:|G703:"
        linters:
          - gosec
      # G204, G702 : git reçoit une liste d'arguments, sans shell ; la référence vient du développeur ou de la CI.
      - path: ^tools/(catalog|openapi)/
        text: "G204:|G702:"
        linters:
          - gosec
      # Code de protoc : gosec y voit des constantes et unsafe qu'on ne réécrit pas.
      - path: ^internal/gen/
        linters:
          - gosec
      # G402 : le test du mTLS dresse un pair en TLS 1.2 pour prouver qu'il est refusé.
      - path: ^internal/platform/mtls/mtls_test\.go$
        text: "G402:"
        linters:
          - gosec
      # Environnement : le chargeur d'infrastructure est le seul lecteur d'un service ; deux outils de CI lisent celui
      # de la CI, ils ne sont pas des services.
      - path: ^(internal/platform/config/config\.go|tools/(catalog|debtguard)/)
        text: "seul internal/platform/config"
        linters:
          - forbidigo
      # Reveal : le test du paquet vérifie que le clair revient intact.
      - path: ^internal/platform/msg/msg_test\.go$
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: false
