<!-- @dsCard group="Colors" viewport="700x170" name="Direction MT / MO" subtitle="MT = accent teal (métrique principale) · MO = bleu neutre (secondaire)" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-page);font:var(--text-body);color:var(--text-primary)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:10px}
.k{font:var(--text-data-sm);color:var(--text-primary)}.v{font:var(--text-data-sm);color:var(--text-faint)}
.cap{font:var(--text-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-faint)}
.tile{border:1px solid var(--border-default);border-radius:var(--r-card);overflow:hidden;background:var(--surface-card)}
.tile .chip{height:44px;border-bottom:1px solid var(--border-subtle)}
.tile .meta{padding:7px 9px;display:flex;flex-direction:column;gap:2px}
.note{font-size:var(--fs-12);color:var(--text-faint);line-height:var(--lh-normal);margin:12px 0 0}
</style></head><body><div class="grid" style="grid-template-columns:1fr 1fr">
<div class="tile"><div class="chip" style="background:var(--mt-accent)"></div><div class="meta"><span class="k">--mt-accent · --mt-surface</span><span class="v">MT — solde réel, bloque à zéro</span></div></div>
<div class="tile"><div class="chip" style="background:var(--mo-accent)"></div><div class="meta"><span class="k">--mo-accent · --mo-surface</span><span class="v">MO — compteur d'usage, ne bloque rien</span></div></div>
</div>
<div class="row" style="margin-top:12px">
<span class="pl-badge pl-badge--mt">MT</span><span style="font:var(--text-metric-sm);color:var(--mt-accent)">504 219</span>
<span class="pl-badge pl-badge--mo">MO</span><span style="font:var(--text-metric-sm);color:var(--mo-accent)">3 120</span>
<span class="v">jamais la même teinte pour les deux directions</span></div></body></html>
