<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-page);font:var(--text-body);color:var(--text-primary)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:10px}
.k{font:var(--text-data-sm);color:var(--text-primary)}.v{font:var(--text-data-sm);color:var(--text-faint)}
.cap{font:var(--text-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-faint)}
.tile{border:1px solid var(--border-default);border-radius:var(--r-card);overflow:hidden;background:var(--surface-card)}
.tile .chip{height:44px;border-bottom:1px solid var(--border-subtle)}
.tile .meta{padding:7px 9px;display:flex;flex-direction:column;gap:2px}
.note{font-size:var(--fs-12);color:var(--text-faint);line-height:var(--lh-normal);margin:12px 0 0}
</style></head><body><div class="row" style="gap:24px">
<div class="row" style="gap:12px"><span style="width:44px;height:44px;border-radius:9px;background:linear-gradient(140deg,var(--teal-300),var(--teal-700));color:var(--n-900);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700">SG</span>
<span style="display:flex;flex-direction:column;gap:2px"><span class="cap">CHARTE GRAPHIQUE & DESIGN SYSTEM</span><span style="font:var(--text-section-title)">SMS Gateway <span style="color:var(--text-muted)">· Admin &amp; Exploitation</span></span></span></div>
<div class="row" style="gap:10px;padding:10px 14px;border-radius:var(--r-card);background:var(--surface-chrome);border:1px solid var(--border-chrome)">
<span class="pl-nav__logo">SG</span><span class="pl-nav__wordmark">SMS Gateway</span><span class="pl-badge pl-badge--accent">PROD</span></div>
</div>
<p class="note">Le dégradé du monogramme (teal-300 → teal-700, 140°) est le seul dégradé du système. Version rail : tuile 26px, nom 13/600, pastille d'environnement à droite.</p></body></html>
