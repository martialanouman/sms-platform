version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/martialanouman/sms-platform/internal/gen
plugins:
  - local: [go, tool, protoc-gen-go]
    out: internal/gen
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-go-grpc]
    out: internal/gen
    opt: paths=source_relative
