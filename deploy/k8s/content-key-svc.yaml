apiVersion: v1
kind: ServiceAccount
metadata:
  name: content-key-svc
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: content-key-svc
spec:
  selector:
    app.kubernetes.io/name: content-key-svc
  ports:
    - name: grpc
      protocol: TCP
      port: 7002
      targetPort: 7002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-key-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: content-key-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: content-key-svc
    spec:
      serviceAccountName: content-key-svc
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 125
      containers:
        - name: content-key-svc
          image: ghcr.io/martialanouman/sms-platform/content-key-svc
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: grpc
              containerPort: 7002
            - name: ops
              containerPort: 9090
          env:
            - name: GRPC_ADDR
              value: ":7002"
            - name: OPENBAO_ADDR
              value: https://openbao.openbao.svc:8200
            - name: TLS_ALLOWED_CLIENTS
              value: admin-api-svc
            - name: TLS_CERT_FILE
              value: /tls/tls.crt
            - name: TLS_KEY_FILE
              value: /tls/tls.key
            - name: TLS_CA_FILE
              value: /tls/ca.crt
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: openbao-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: content-key-svc-tls
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: openbao
                  expirationSeconds: 3600
                  path: token
